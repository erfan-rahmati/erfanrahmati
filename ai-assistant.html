<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>عرفی | منشی هوشمند عرفان رحمتی</title>
    <meta name="description"
        content="منشی هوشمند کسب‌وکار عرفان رحمتی - پاسخگوی سوالات تخصصی در حوزه برنامه‌نویسی، طراحی سایت، اپلیکیشن، هوش مصنوعی، سئو، دیجیتال مارکتینگ و استراتژی رشد کسب‌وکار">
    <link rel="stylesheet" href="assets/css/all.min.css">
    <link rel="stylesheet" href="assets/css/ai-assistant.css">
</head>

<body>

    <header class="ai-header">
        <div class="ai-header-logo">
            <div class="ai-logo-icon"><i class="fas fa-robot"></i></div>
            <div class="ai-logo-text">
                <h1>عرفی | منشی هوشمند عرفان رحمتی</h1>
                <div class="connection-status"><span class="status-dot"></span><span id="apiStatus">در حال
                        اتصال...</span></div>
            </div>
        </div>
        <div class="ai-header-actions">
            <button id="themeToggleAI" class="ai-header-btn"><i id="themeIconAI" class="fas fa-moon"></i></button>
            <button id="clearChatBtn" class="ai-header-btn"><i class="fas fa-trash-alt"></i></button>
            <a href="index.html" class="ai-header-btn"><i class="fas fa-home"></i></a>
        </div>
    </header>

    <div class="ai-chat-container" id="chatContainer"></div>

    <div id="typingIndicator" style="display: none;">
        <div class="typing-indicator">
            <div class="message-avatar"><i class="fas fa-robot"></i></div>
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
    </div>

    <button id="scrollBottomBtn" class="scroll-bottom-btn"><i class="fas fa-chevron-down"></i></button>

    <footer class="ai-input-footer">
        <div class="input-wrapper">
            <div class="input-container">
                <textarea id="messageInput" class="ai-input" rows="1"
                    placeholder="سوال کسب‌وکار خود را بپرسید..."></textarea>
                <button id="sendBtn" class="send-btn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </div>
            <div class="suggestions-dropdown">
                <button class="suggestions-toggle-btn" id="suggestionsToggleBtn">
                    <i class="fas fa-lightbulb"></i>
                    <span>سوالات پرتکرار</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="suggestions-panel" id="suggestionsPanel">
                    <div class="suggestion-item" data-question="چطور می‌توانم درآمد کسب‌وکارم را افزایش دهم؟"><i
                            class="fas fa-chart-line"></i> افزایش درآمد</div>
                    <div class="suggestion-item"
                        data-question="برای راه‌اندازی فروشگاه اینترنتی چه مراحلی باید طی کنم؟"><i
                            class="fas fa-store"></i> راه‌اندازی فروشگاه اینترنتی</div>
                    <div class="suggestion-item"
                        data-question="هزینه طراحی سایت فروشگاهی چقدر است و چه خدماتی شامل می‌شود؟"><i
                            class="fas fa-coin"></i> هزینه و خدمات سایت فروشگاهی</div>
                    <div class="suggestion-item"
                        data-question="تفاوت وردپرس و کدنویسی اختصاصی در طراحی سایت چیست؟"><i
                            class="fas fa-code"></i> وردپرس یا کدنویسی اختصاصی</div>
                    <div class="suggestion-item" data-question="بهترین استراتژی سئو برای کسب‌وکار من چیست؟"><i
                            class="fas fa-search"></i> استراتژی سئو</div>
                    <div class="suggestion-item" data-question="عرفان رحمتی کیست و چه خدماتی ارائه می‌دهد؟"><i
                            class="fas fa-user-tie"></i> معرفی عرفان و خدمات</div>
                    <div class="suggestion-item" data-question="چطور می‌توانم برند خود را قدرتمند کنم؟"><i
                            class="fas fa-trademark"></i> برندسازی قدرتمند</div>
                </div>
            </div>
        </div>
    </footer>

    <script src="assets/js/ai-assistant.js"></script>
</body>

</html>
